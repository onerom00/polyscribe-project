name: PolyScribe core validation

on:
  pull_request:
  push:
    branches: [polyscribe-one-core]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: polyscribe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      FLASK_SKIP_DOTENV: "1"
      OPENAI_API_KEY: local-test-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: SQLite tests
        run: python -m unittest discover -s tests -v
      - name: PostgreSQL tests
        env:
          POLYSCRIBE_TEST_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/polyscribe_test
        run: python -m unittest discover -s tests -v
      - run: git diff --check
