<!-- templates/history.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Historial · PolyScribe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- ✅ Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6TFFRMS8K0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-6TFFRMS8K0');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/badge.css') }}">

  <style>
    :root{--bg:#e6f0ff;--card:#fff;--text:#0b1424;--muted:#4b5563;--border:#d9e4f7;--accent:#0b62e0;}
    *{box-sizing:border-box}
    body{margin:0;background:#cfe5ff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
    .container{max-width:980px;margin:24px auto;padding:0 16px}

    /* NAV estilo home */
    header.ps-nav{background:#fff;border-bottom:1px solid var(--border)}
    .ps-nav .inner{
      max-width:980px;margin:0 auto;padding:10px 16px;
      display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap
    }
    .ps-nav .brand{font-weight:900;color:#0b1424;text-decoration:none;font-size:1.05rem}
    .ps-nav .links a{margin-right:14px;text-decoration:none;color:#13406f;font-weight:800;font-size:.95rem}
    .ps-nav .links a.active{color:#0b62e0}
    .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

    .badge-usage{
      display:none;
      align-items:center;gap:8px;
      background:#e8f3ff;color:#0b1424;border:1px solid #b9d9ff;border-radius:999px;
      padding:5px 10px;font-size:13px;font-weight:800
    }
    .a11y-btn{
      background:#f2f6ff;border:1px solid #cddaf5;color:#0b1424;
      padding:6px 10px;border-radius:10px;cursor:pointer;
      font-weight:700;font-size:.95rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px
    }

    h1{font-size:20px;margin:18px 0 10px}
    a{color:var(--accent);text-decoration:none}

    .cards{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .left{display:flex;flex-direction:column;gap:6px}
    .meta{display:flex;gap:8px;flex-wrap:wrap}
    .pill{border:1px solid var(--border);border-radius:999px;padding:2px 8px;color:#1f2937;background:#f7fbff;font-size:12px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{background:#0b62e0;border:1px solid #0a59c9;color:#fff;font-weight:900;padding:8px 12px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
    .btn-secondary{background:#f2f6ff;color:#0b1424;border:1px solid #cddaf5}
    .muted{color:var(--muted);font-size:13px}
    .alert{display:none;margin:10px 0 12px;background:#fff4e5;border:1px solid #f4c08a;color:#7b3d00;padding:10px;border-radius:12px;font-size:14px}
    .alert.ok{background:#e2f7e9;border-color:#8ad19d;color:#125325}
    @media (max-width:700px){.card{flex-direction:column;align-items:flex-start;gap:10px}}
  </style>
</head>

<body>
  <!-- NAV -->
  <header class="ps-nav">
    <div class="inner">
      <a class="brand" href="/">PolyScribe</a>

      <nav class="links ps-nav-links">
        <a href="/" data-path="/">Transcribir</a>
        <a href="/history" data-path="/history" class="active">Historial</a>
        <a href="/pricing" data-path="/pricing">Precios</a>
        <a href="/ayuda" data-path="/ayuda">Ayuda</a>
      </nav>

      <div class="right">
        <span id="usage-badge-nav" class="badge-usage">
          <span id="usage-text-nav">—/— min · libre —</span>
        </span>

        <!-- auth buttons (los controla nav_auth.js) -->
        <a href="/auth/login" class="a11y-btn" id="nav-login-link">Entrar</a>
        <a href="/auth/register" class="a11y-btn" id="nav-signup-link"
           style="background:#22c55e;border-color:#16a34a;color:#0b111d">Registro</a>

        <a href="/account" class="a11y-btn" id="nav-account-link" style="display:none">Mi cuenta</a>
        <a href="/auth/logout" class="a11y-btn" id="nav-logout-link" style="display:none">Salir</a>

        <!-- volver inteligente -->
        <a class="a11y-btn" href="/" id="btn-back">Volver</a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1>Historial</h1>
    <div class="muted">Tus transcripciones recientes (de tu cuenta).</div>

    <div class="alert" id="alert-box"></div>
    <div class="cards" id="cards"></div>
    <p class="muted" id="empty" style="display:none;margin-top:14px;">No hay registros.</p>
  </div>

  <!-- Este script solo muestra/oculta botones del nav y puede setear dataset -->
  <script src="{{ url_for('static', filename='js/nav_auth.js') }}"></script>

  <script>
    (function(){
      const $ = (s) => document.querySelector(s);

      const cards = $("#cards");
      const empty = $("#empty");
      const alertBox = $("#alert-box");
      const btnBack = $("#btn-back");

      const usageBadge = $("#usage-badge-nav");
      const usageTextNav = $("#usage-text-nav");

      function showWarn(msg){
        if (!alertBox) return;
        alertBox.textContent = msg;
        alertBox.classList.remove("ok");
        alertBox.style.display = "block";
      }
      function showOk(msg){
        if (!alertBox) return;
        alertBox.textContent = msg;
        alertBox.classList.add("ok");
        alertBox.style.display = "block";
      }
      function hideAlert(){
        if (!alertBox) return;
        alertBox.style.display = "none";
        alertBox.textContent = "";
        alertBox.classList.remove("ok");
      }

      function esc(s){
        return String(s||"").replace(/[&<>"']/g, (c) => ({
          "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
        }[c]));
      }
      function pill(text){
        const sp = document.createElement("span");
        sp.className = "pill";
        sp.textContent = text;
        return sp;
      }

      function buildCard(it){
        const id = it.id || it.job_id || "";
        const filename = it.filename || (id ? ("job " + id) : "job");
        const langSel = it.language || "auto";
        const langDet = it.language_detected || "—";
        const status = it.status || "done";
        const created = it.created_at || "";

        const card = document.createElement("div");
        card.className = "card";

        const left = document.createElement("div");
        left.className = "left";

        const title = document.createElement("div");
        title.innerHTML = `<strong>${esc(filename)}</strong>`;
        left.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.appendChild(pill(`id: ${id}`));
        meta.appendChild(pill(`sel: ${langSel}`));
        meta.appendChild(pill(`det: ${langDet}`));
        meta.appendChild(pill(status));
        if (created) meta.appendChild(pill(created));
        left.appendChild(meta);

        const actions = document.createElement("div");
        actions.className = "actions";

        const aVer = document.createElement("a");
        aVer.className = "btn";
        aVer.href = `/?job_id=${encodeURIComponent(id)}`;
        aVer.textContent = "Ver";
        aVer.addEventListener("click", () => {
          try{ localStorage.setItem("ps_last_job_id", String(id||"")); }catch{}
        });
        actions.appendChild(aVer);

        const aJson = document.createElement("a");
        aJson.className = "btn btn-secondary";
        aJson.href = `/jobs/${encodeURIComponent(id)}`;
        aJson.target = "_blank";
        aJson.rel = "noopener";
        aJson.textContent = "JSON";
        actions.appendChild(aJson);

        card.appendChild(left);
        card.appendChild(actions);
        return card;
      }

      function setBackLink(){
        const lastJob = (localStorage.getItem("ps_last_job_id") || "").trim();
        if (lastJob) {
          btnBack.href = `/?job_id=${encodeURIComponent(lastJob)}`;
          return;
        }
        btnBack.href = `/`;
      }

      async function fetchMe(){
        try{
          const res = await fetch("/api/auth/me", { method:"GET", credentials:"include" });
          const txt = await res.text();
          let data = {};
          try{ data = JSON.parse(txt); }catch{ data = {}; }
          if (!res.ok) return { authenticated:false };
          return data || { authenticated:false };
        }catch{
          return { authenticated:false };
        }
      }

      async function refreshBadge(isLogged){
        try{
          if (!usageBadge || !usageTextNav) return;

          if (!isLogged){
            usageBadge.style.display = "none";
            usageTextNav.textContent = "—/— min · libre —";
            return;
          }

          const res = await fetch("/api/usage/balance", { method:"GET", credentials:"include" });
          const txt = await res.text();
          let j = {};
          try{ j = JSON.parse(txt); }catch{ j = {}; }

          if (!res.ok){
            // si por alguna razón no deja leer balance, ocultamos badge sin romper UI
            usageBadge.style.display = "none";
            return;
          }

          const usedMin  = (Number(j.used_seconds||0) / 60);
          const allowMin = (Number(j.allowance_seconds||0) / 60);
          const remain   = Math.max(0, allowMin - usedMin);

          usageTextNav.textContent = `${usedMin.toFixed(1)}/${allowMin.toFixed(0)} min · libre ${remain.toFixed(1)} min`;
          usageBadge.style.display = "inline-flex";
        }catch{
          if (usageBadge) usageBadge.style.display = "none";
        }
      }

      async function loadHistory(isLogged){
        hideAlert();
        if (cards) cards.innerHTML = "";
        if (empty) empty.style.display = "none";

        if (!isLogged){
          showWarn("🔒 Inicia sesión para ver tu historial.");
          if (empty) empty.style.display = "block";
          return;
        }

        // ✅ HISTORIAL por sesión (sin headers X-User-Id)
        const res = await fetch("/api/history?limit=100", { method:"GET", credentials:"include" });
        const txt = await res.text();
        let body = {};
        try{ body = JSON.parse(txt); }catch{ body = {}; }

        if (!res.ok){
          if (res.status === 401){
            showWarn("🔒 Tu sesión expiró. Inicia sesión de nuevo.");
          } else {
            showWarn("No se pudo cargar el historial. Verifica que /api/history esté activo.");
          }
          if (empty) empty.style.display = "block";
          return;
        }

        const items = (body && body.items) ? body.items : [];
        if(!items.length){
          if (empty) empty.style.display = "block";
          return;
        }

        items.forEach(it => cards.appendChild(buildCard(it)));
      }

      async function boot(){
        setBackLink();

        const me = await fetchMe();
        const isLogged = !!(me && me.authenticated);

        await refreshBadge(isLogged);
        await loadHistory(isLogged);

        // (opcional) tracking
        try{
          if (typeof gtag === "function"){
            gtag("event", "view_history", { user_type: isLogged ? "logged" : "guest" });
          }
        }catch{}
      }

      // init
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
