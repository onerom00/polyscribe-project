<!-- templates/history.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Historial · PolyScribe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- ✅ Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6TFFRMS8K0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-6TFFRMS8K0');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#e6f0ff;--card:#fff;--text:#0b1424;--muted:#4b5563;--border:#d9e4f7;--accent:#0b62e0;}
    *{box-sizing:border-box}
    body{margin:0;background:#cfe5ff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
    .container{max-width:980px;margin:24px auto;padding:0 16px}
    header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px;gap:12px;flex-wrap:wrap}
    a{color:var(--accent);text-decoration:none}
    .cards{display:grid;grid-template-columns:1fr;gap:12px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .left{display:flex;flex-direction:column;gap:6px}
    .meta{display:flex;gap:8px;flex-wrap:wrap}
    .pill{border:1px solid var(--border);border-radius:999px;padding:2px 8px;color:#1f2937;background:#f7fbff;font-size:12px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{background:#0b62e0;border:1px solid #0a59c9;color:#fff;font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
    .btn-secondary{background:#f2f6ff;color:#0b1424;border:1px solid #cddaf5}
    h1{font-size:20px;margin:8px 0 16px}
    nav{display:flex;gap:12px;font-weight:700;flex-wrap:wrap}
    .topbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px;align-items:center;flex-wrap:wrap}
    .badge{background:#e8f3ff;border:1px solid #b9d9ff;border-radius:999px;padding:6px 10px;color:#0b1424;font-size:12px;font-weight:700}
    .muted{color:var(--muted);font-size:13px}
    .alert{display:none;margin:10px 0 12px;background:#fff4e5;border:1px solid #f4c08a;color:#7b3d00;padding:10px;border-radius:12px;font-size:14px}
    .alert.ok{background:#e2f7e9;border-color:#8ad19d;color:#125325}

    /* ✅ Auth CTA box */
    .auth-box{
      display:none;
      margin:14px 0 12px;
      background:#ffffff;
      border:1px solid #b9d9ff;
      border-radius:14px;
      padding:12px 12px;
      box-shadow:0 10px 24px rgba(15,35,52,.10);
    }
    .auth-box .t{font-weight:800;margin-bottom:6px}
    .auth-box .s{color:#13406f;font-size:13px;margin-bottom:10px}
    .auth-box .row{display:flex;gap:10px;flex-wrap:wrap}
    .btnx{
      background:#0b62e0;border:1px solid #0a59c9;color:#fff;
      font-weight:800;padding:8px 12px;border-radius:10px;
      text-decoration:none;display:inline-flex;align-items:center
    }
    .btnx.secondary{
      background:#22c55e;border-color:#16a34a;color:#0b111d;
    }

    @media (max-width:700px){.card{flex-direction:column;align-items:flex-start;gap:10px}}
  </style>
</head>

<body data-user-id="{{ user_id|default('') }}">
  <div class="container">
    <header>
      <nav>
        <a href="/">PolyScribe</a>
        <a href="/">Transcribir</a>
        <a href="/history">Historial</a>
        <a href="/pricing">Precios</a>
        <a href="/ayuda">Ayuda</a>
      </nav>
      <div class="topbar">
        <span class="badge" id="usage-text">—/— min · libre —</span>
        <a class="btn btn-secondary" href="/" id="btn-back">Volver</a>
      </div>
    </header>

    <h1>Historial</h1>
    <div class="muted">Tus transcripciones recientes (según tu cuenta).</div>

    <!-- alert-box sirve para warnings y para confirmación post-pago -->
    <div class="alert" id="alert-box"></div>

    <!-- ✅ CTA si no hay sesión -->
    <div class="auth-box" id="auth-box">
      <div class="t">🔒 Inicia sesión para ver tu historial</div>
      <div class="s">Esto evita que se mezclen transcripciones entre usuarios.</div>
      <div class="row">
        <a class="btnx" href="/auth/login">Entrar</a>
        <a class="btnx secondary" href="/auth/register">Registro</a>
      </div>
    </div>

    <div class="cards" id="cards"></div>
    <p class="muted" id="empty" style="display:none;margin-top:14px;">No hay registros.</p>
  </div>

  <script>
    (function(){
      const $ = (s) => document.querySelector(s);

      const cards = $("#cards");
      const empty = $("#empty");
      const alertBox = $("#alert-box");
      const btnBack = $("#btn-back");
      const usageText = $("#usage-text");
      const authBox = $("#auth-box");

      function showWarn(msg){
        if (!alertBox) return;
        alertBox.textContent = msg;
        alertBox.classList.remove("ok");
        alertBox.style.display = "block";
      }
      function showOk(msg){
        if (!alertBox) return;
        alertBox.textContent = msg;
        alertBox.classList.add("ok");
        alertBox.style.display = "block";
      }
      function hideAlert(){
        if (!alertBox) return;
        alertBox.style.display = "none";
        alertBox.textContent = "";
        alertBox.classList.remove("ok");
      }

      // ============================
      // ✅ SESIÓN REAL: whoami
      // ============================
      async function getSessionUserId(){
        try{
          const r = await fetch("/api/usage/whoami", {
            method:"GET",
            credentials:"same-origin",
            headers: { "Accept":"application/json" }
          });
          if (!r.ok) return "";
          const j = await r.json().catch(()=> ({}));
          if (j && j.user_id) return String(j.user_id).trim();
          return "";
        }catch(_){
          return "";
        }
      }

      function clearLocalUserId(){
        try{ localStorage.removeItem("user_id"); }catch(_){}
      }

      // ============================
      // ✅ Post-pago: /history?paid=1
      // (sin user_id en URL)
      // ============================
      function handlePaidQuery(){
        const qs = new URLSearchParams(window.location.search);
        const paid = (qs.get("paid") || "").trim();

        if (paid === "1") {
          showOk("✅ Pago confirmado. Tus minutos fueron acreditados. (Si no ves el saldo actualizado, refresca en 2–3s).");

          try{
            if (typeof gtag === "function") {
              gtag("event", "purchase_completed", { page: "history" });
            }
          }catch(_){}

          try{
            window.history.replaceState({}, "", window.location.pathname);
          }catch(_){}
        }
      }

      // VOLVER INTELIGENTE (sin depender de referrer)
      function setBackLink(sessionUserId){
        const lastJob = (localStorage.getItem("ps_last_job_id") || "").trim();

        // ✅ Solo añadimos user_id si la sesión existe
        if (lastJob) {
          const q = sessionUserId
            ? `?job_id=${encodeURIComponent(lastJob)}&user_id=${encodeURIComponent(sessionUserId)}`
            : `?job_id=${encodeURIComponent(lastJob)}`;
          btnBack.href = `/${q}`;
          return;
        }

        btnBack.href = sessionUserId
          ? `/?user_id=${encodeURIComponent(sessionUserId)}`
          : `/`;
      }

      async function api(url, opts = {}, sessionUserId){
        const h = opts.headers ? {...opts.headers} : {};
        if (sessionUserId && !h["X-User-Id"]) h["X-User-Id"] = sessionUserId;
        const res = await fetch(url, {...opts, headers: h, credentials:"same-origin"});
        const txt = await res.text();
        let body;
        try{ body = JSON.parse(txt); }catch{ body = txt; }
        return { ok: res.ok, status: res.status, body };
      }

      // Badge de uso
      async function refreshBadge(sessionUserId){
        try{
          if (!sessionUserId){
            if (usageText) usageText.textContent = "—/— min · libre —";
            return;
          }

          const r = await api(`/api/usage/balance?user_id=${encodeURIComponent(sessionUserId)}`, {}, sessionUserId);
          if(!r.ok) return;

          const j = r.body || {};
          const usedMin  = (Number(j.used_seconds||0) / 60);
          const allowMin = (Number(j.allowance_seconds||0) / 60);
          const remain   = Math.max(0, allowMin - usedMin);

          if (usageText){
            usageText.textContent = `${usedMin.toFixed(1)}/${allowMin.toFixed(0)} min · libre ${remain.toFixed(1)} min`;
          }
        }catch(_){}
      }

      function esc(s){
        return String(s||"").replace(/[&<>"']/g, (c) => ({
          "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
        }[c]));
      }

      function pill(text){
        const sp = document.createElement("span");
        sp.className = "pill";
        sp.textContent = text;
        return sp;
      }

      function buildCard(it, sessionUserId){
        const id = it.id || it.job_id || "";
        const filename = it.filename || (id ? ("job " + id) : "job");
        const langSel = it.language || "auto";
        const langDet = it.language_detected || "—";
        const status = it.status || "done";
        const created = it.created_at || "";

        const card = document.createElement("div");
        card.className = "card";

        const left = document.createElement("div");
        left.className = "left";

        const title = document.createElement("div");
        title.innerHTML = `<strong>${esc(filename)}</strong>`;
        left.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.appendChild(pill(`id: ${id}`));
        meta.appendChild(pill(`sel: ${langSel}`));
        meta.appendChild(pill(`det: ${langDet}`));
        meta.appendChild(pill(status));
        if (created) meta.appendChild(pill(created));
        left.appendChild(meta);

        const actions = document.createElement("div");
        actions.className = "actions";

        const aVer = document.createElement("a");
        aVer.className = "btn";
        aVer.href = `/?job_id=${encodeURIComponent(id)}&user_id=${encodeURIComponent(sessionUserId)}`;
        aVer.textContent = "Ver";
        aVer.addEventListener("click", () => {
          try{ localStorage.setItem("ps_last_job_id", String(id||"")); }catch(_){}
        });
        actions.appendChild(aVer);

        const aJson = document.createElement("a");
        aJson.className = "btn btn-secondary";
        aJson.href = `/jobs/${encodeURIComponent(id)}?user_id=${encodeURIComponent(sessionUserId)}`;
        aJson.target = "_blank";
        aJson.rel = "noopener";
        aJson.textContent = "JSON";
        actions.appendChild(aJson);

        card.appendChild(left);
        card.appendChild(actions);
        return card;
      }

      async function loadHistory(sessionUserId){
        hideAlert();
        if (cards) cards.innerHTML = "";
        if (empty) empty.style.display = "none";

        if (!sessionUserId){
          if (authBox) authBox.style.display = "block";
          showWarn("🔒 Inicia sesión para ver tu historial.");
          if (empty) empty.style.display = "block";
          return;
        }

        if (authBox) authBox.style.display = "none";

        const r = await api(`/api/history?limit=100&user_id=${encodeURIComponent(sessionUserId)}`, {}, sessionUserId);
        if(!r.ok){
          showWarn("No se pudo cargar el historial. Verifica que /api/history esté activo.");
          if (empty) empty.style.display = "block";
          return;
        }

        const items = (r.body && r.body.items) ? r.body.items : [];
        if(!items.length){
          if (empty) empty.style.display = "block";
          return;
        }

        items.forEach(it => cards.appendChild(buildCard(it, sessionUserId)));
      }

      // ============================
      // INIT
      // ============================
      (async function init(){
        handlePaidQuery();

        // ✅ Usuario SOLO por sesión real
        const sessionUserId = await getSessionUserId();

        // Si no hay sesión, limpiamos cualquier user_id “pegajoso”
        if (!sessionUserId) clearLocalUserId();

        setBackLink(sessionUserId);
        refreshBadge(sessionUserId);

        // Si vienes de pago, refresca badge otra vez (latencia DB)
        const qs = new URLSearchParams(window.location.search);
        if ((qs.get("paid") || "").trim() === "1") {
          setTimeout(() => refreshBadge(sessionUserId), 2500);
        }

        loadHistory(sessionUserId);
      })();

    })();
  </script>
  <script src="{{ url_for('static', filename='js/nav_auth.js') }}"></script>

</body>
</html>
